# One Sage ProvideX ODBC driver message per rule in src/sage100_mcp/errors.yaml (SPEC.md §14.3), in the
# shape pyodbc reports: exception args (sqlstate, message), message "[STATE] text (native) (function)".
# The text after the bracketed state is quoted from the source; where the source was another client
# (.NET, mxODBC, a SQL Server linked server) the SQLSTATE and function are those pyodbc would add.
- code: DRIVER_NOT_INSTALLED
  phase: connect
  sqlstate: IM003
  source: sage100-mcp's 32-bit driver helper (src/sage100_mcp/bridge/client.py, not_started)
  message: "[IM003] [sage100-mcp][32-bit helper]The 32-bit driver helper could not start: it exited with code 3: pyodbc can't be imported by C:\\Python312-32\\python.exe: No module named 'pyodbc'"
- code: BACKEND_UNREACHABLE
  phase: execute
  sqlstate: 08S01
  source: sage100-mcp's 32-bit driver helper (src/sage100_mcp/bridge/client.py, stopped)
  message: "[08S01] [sage100-mcp][32-bit helper]The 32-bit driver helper stopped (exit code 3221225477)"
- code: DRIVER_NOT_INSTALLED
  phase: connect
  sqlstate: IM002
  source: Windows ODBC Driver Manager (documented message)
  message: "[IM002] [Microsoft][ODBC Driver Manager] Data source name not found and no default driver specified (0) (SQLDriverConnect)"
