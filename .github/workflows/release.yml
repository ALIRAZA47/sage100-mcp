name: release

# The release artifacts (SPEC.md §16.3), built for a v* tag or by hand. Nothing is published unless the
# repository says so (docs/decisions.md D73):
# - python: the wheel and sdist, installed into a fresh environment that must answer sage_status.
# - helper32: the 32-bit driver helper (packaging/odbc32.spec), built under 32-bit Python (D67).
# - windows: the 64-bit server (packaging/sage100-mcp.spec), with the helper inside it as odbc32\, both
#   smoke-tested, Authenticode-signed when the signing secrets exist, and wrapped in the MSI
#   (packaging/wix/sage100-mcp.wxs), which is installed, checked and removed on the runner.
# - draft: a draft GitHub release holding the artifacts and their SHA-256 sums, for a tag.
# - pypi and registry: off until the repository variables PUBLISH_PYPI and PUBLISH_REGISTRY are "true".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - name: The wheel installs into a fresh environment and answers sage_status over stdio
        run: |
          uv venv build/fresh
          uv pip install --python build/fresh dist/*.whl
          uv run --with mcp python scripts/stdio_smoke.py build/fresh/bin/sage100-mcp stdio
      - uses: actions/upload-artifact@v5
        with:
          name: python
          path: dist/

  helper32:
    name: 32-bit driver helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x86
      - run: python -m pip install pyinstaller==6.22.3 pyodbc==5.3.0
      - run: python -m PyInstaller packaging/odbc32.spec --noconfirm --distpath build/odbc32 --workpath build/pyinstaller32
      - uses: actions/upload-artifact@v5
        with:
          name: odbc32
          path: build/odbc32/odbc32/

  windows:
    name: Windows x64 MSI
    needs: helper32
    runs-on: windows-latest
    env:
      SIGNING: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: The server, one folder (PyInstaller)
        run: uv run --with pyinstaller==6.22.3 pyinstaller packaging/sage100-mcp.spec --noconfirm --distpath build/dist --workpath build/pyinstaller
      - uses: actions/download-artifact@v6
        with:
          name: odbc32
          path: build/dist/sage100-mcp/odbc32
      - name: The frozen server answers sage_status over stdio
        run: uv run python scripts/stdio_smoke.py build/dist/sage100-mcp/sage100-mcp.exe stdio
      - name: The frozen helper reads a 32-bit-only driver for the 64-bit server
        run: uv run python scripts/helper_smoke.py --helper build/dist/sage100-mcp/odbc32/sage100-mcp-odbc32.exe
      - name: Sign the programs
        if: env.SIGNING == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            build\dist\sage100-mcp\sage100-mcp.exe build\dist\sage100-mcp\odbc32\sage100-mcp-odbc32.exe
          $code = $LASTEXITCODE
          Remove-Item $pfx
          exit $code
      - name: Build the MSI (WiX 5)
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = uv run python -c "import re, sage100_mcp; print(re.match(r'\d+\.\d+\.\d+', sage100_mcp.__version__)[0])"
          wix build packaging/wix/sage100-mcp.wxs -arch x64 -d Version=$version -d Source=build\dist\sage100-mcp -o build\msi\sage100-mcp-x64.msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign the MSI
        if: env.SIGNING == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build\msi\sage100-mcp-x64.msi
          $code = $LASTEXITCODE
          Remove-Item $pfx
          exit $code
      - name: The MSI installs, serves from PATH, and uninstalls
        run: |
          $msi = (Resolve-Path build\msi\sage100-mcp-x64.msi).Path
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v build\msi\install.log" -Wait -PassThru
          if ($install.ExitCode) { Get-Content build\msi\install.log -Tail 50; exit $install.ExitCode }
          $folder = Join-Path $env:ProgramFiles "sage100-mcp"
          & "$folder\sage100-mcp.exe" --version
          if (-not (Test-Path "$folder\odbc32\sage100-mcp-odbc32.exe")) { throw "the 32-bit helper is missing" }
          if ([Environment]::GetEnvironmentVariable("PATH", "Machine") -notlike "*$folder*") { throw "not on PATH" }
          $home_acl = (Get-Acl (Join-Path $env:ProgramData "sage100-mcp")).Access | ForEach-Object { $_.IdentityReference.Value }
          $home_acl
          if ($home_acl | Where-Object { $_ -notmatch "Administrators|SYSTEM" }) { throw "the home folder admits others" }
          $remove = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($remove.ExitCode) { exit $remove.ExitCode }
          if (Test-Path "$folder\sage100-mcp.exe") { throw "uninstall left the program" }
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: build/msi/sage100-mcp-x64.msi

  draft:
    name: draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft the release with the artifacts and their sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "sage100-mcp $GITHUB_REF_NAME" --notes "See docs/setup.md for installing it." *

  pypi:
    # PyPI trusted publishing (an environment named pypi, registered as a trusted publisher on PyPI).
    name: publish to PyPI
    if: vars.PUBLISH_PYPI == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [python, windows]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    # The MCP registry entry (server.json). Its com.outova namespace is proven by DNS: an Ed25519 key whose
    # public half is in a TXT record on outova.com, with the private half in MCP_REGISTRY_PRIVATE_KEY.
    name: publish to the MCP registry
    if: vars.PUBLISH_REGISTRY == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: mcp-publisher (pin MCP_PUBLISHER_VERSION to a reviewed release)
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${{ vars.MCP_PUBLISHER_VERSION }}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain outova.com --private-key "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}"
          ./mcp-publisher publish
